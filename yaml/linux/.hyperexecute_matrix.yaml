---
version: '0.1'
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  os: [linux]
  files: ["react_app_test.js","todo_test.js"]

runson: ${matrix.os}

pre:
  # clear the stale Chrome profile lock left in the VM image
  - rm -f ~/.config/google-chrome/Singleton*
  - npm install

cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

mergeArtifacts: true
uploadArtefacts:
  - name: FinalReport 
    path:
    - /

report: true
partialReports:
  type: json
  location: /
  frameworkName: extent

testSuites:
  - npx codeceptjs run $files --steps

jobLabel: [puppeteer-CodeceptJS, linux, matrix]