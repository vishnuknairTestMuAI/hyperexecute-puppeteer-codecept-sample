version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: ${matrix.os}
retryOnFailure: true
autosplit: true
maxRetries: 1
parallelism: 1
concurrency: 2

matrix:
  os: [linux]

pre:
  # clear the stale Chrome profile lock left in the VM image
  - rm -f ~/.config/google-chrome/Singleton*
  - npm install

cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

mergeArtifacts: true
uploadArtefacts:
  - name: FinalReport
    path:
    - /

report: true
partialReports:
    type: json
    location: /
    frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep -lr 'Scenario' *test.js
testRunnerCommand: npx codeceptjs run $test --steps

jobLabel: [puppeteer-codecept, hybrid]
